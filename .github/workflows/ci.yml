name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Proves the template is still green when nobody has touched it.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    # Keep the full feedback loop cheap enough for people and agents to wait for.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      # Vitest requires Node >= 22.12 and does not support the bun runtime with
      # the v8 coverage provider. bun installs and runs scripts; Node runs tests.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # A clean checkout is always a clean tree. bun's isolated installs are not
      # pruned incrementally, so a stale local node_modules can hide a removed
      # dependency that fails here.
      - run: bun install --frozen-lockfile
      - run: bun run ci
