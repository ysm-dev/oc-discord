services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.0.32
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:?Set OPENCODE_PASSWORD}
    ports: ["127.0.0.1:4096:4096"]
    volumes:
      - type: bind
        source: ${OC_DISCORD_DIRECTORY:-${HOME}/discord-bot}
        target: ${OC_DISCORD_DIRECTORY:-${HOME}/discord-bot}
        bind:
          create_host_path: false
      - opencode-data:/root/.local/share/opencode
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  opencode-data:
